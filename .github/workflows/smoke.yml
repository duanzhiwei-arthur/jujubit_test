name: Android Real Device Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# 联调阶段先去掉 concurrency，避免旧任务占住
# concurrency:
#   group: android-real-device-smoke
#   cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: [self-hosted]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "whoami=$(whoami)"
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=${{ github.workspace }}"
          pwd
          ls -la
          python3 --version || true
          node --version || true
          npm --version || true
          which adb || true
          adb version || true
          which appium || true
          appium -v || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check adb and device
        run: |
          adb devices
          adb get-state

      - name: Show device info
        run: |
          echo "Device Model:"
          adb shell getprop ro.product.model
          echo "Android Version:"
          adb shell getprop ro.build.version.release

      - name: Start Appium
        run: |
          nohup appium -p 4723 --base-path / > "${{ github.workspace }}/appium.log" 2>&1 &
          sleep 10

      - name: Verify Appium
        run: |
          curl http://127.0.0.1:4723/status

      - name: Prepare report dirs
        run: |
          mkdir -p "${{ github.workspace }}/reports/allure-results"
          mkdir -p "${{ github.workspace }}/screenshots"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/reports" || true

      - name: Run smoke tests
        id: run_tests
        run: |
          set +e
          pytest tests -v -s --alluredir="${{ github.workspace }}/reports/allure-results"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ${{ github.workspace }}/reports/allure-results
          if-no-files-found: ignore

      - name: Upload appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: ${{ github.workspace }}/appium.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: ignore

      - name: Notify Feishu
        if: always()
        run: |
          if [ "${{ steps.run_tests.outputs.exit_code }}" = "0" ]; then
            STATUS="成功"
          else
            STATUS="失败"
          fi

          ACTION_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"【Android冒烟自动化】执行${STATUS}\n仓库：${{ github.repository }}\n分支：${{ github.ref_name }}\n执行人：${{ github.actor }}\n详情：${ACTION_URL}\"
              }
            }"

      - name: Fail job if tests failed
        if: steps.run_tests.outputs.exit_code != '0'
        run: |
          echo "Smoke tests failed"
          exit 1