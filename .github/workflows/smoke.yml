name: Android Real Device Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
concurrency:
  group: android-real-device-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check adb and device
        run: |
          adb devices
          adb get-state

      - name: Show device info
        run: |
          echo "Device Model:"
          adb shell getprop ro.product.model
          echo "Android Version:"
          adb shell getprop ro.build.version.release

      - name: Start Appium
        run: |
          nohup appium -p 4723 --base-path / > appium.log 2>&1 &
          sleep 10

      - name: Verify Appium
        run: |
          curl http://127.0.0.1:4723/status

      - name: Prepare report dirs
        run: |
          mkdir -p reports/allure-results

      - name: Run smoke tests
        id: run_tests
        shell: bash
        run: |
          set +e
          pytest tests -v -s --alluredir=reports/allure-results
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: ignore

      - name: Upload appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Notify Feishu
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run_tests.outputs.exit_code }}" = "0" ]; then
            STATUS="成功"
          else
            STATUS="失败"
          fi

          ACTION_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"msg_type\": \"text\",
            \"content\": {
              \"text\": \"【Android冒烟自动化】执行${STATUS}\n仓库：${{ github.repository }}\n分支：${{ github.ref_name }}\n执行人：${{ github.actor }}\n详情：${ACTION_URL}\"
            }
          }"

      - name: Fail job if tests failed
        if: steps.run_tests.outputs.exit_code != '0'
        run: |
          echo "Smoke tests failed"
          exit 1